<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout</title>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#111417">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#111417; --surface:#191D22; --surface-2:#22272E;
  --line:#2E353D; --line-soft:#232A31;
  --ink:#EDF0F3; --ink-2:#C4CBD3; --muted:#98A2AE; --faint:#79838F;
  --accent:#F2703A; --accent-ink:#1A0E08; --accent-soft:#33200F;
  --good:#5CBF90; --good-soft:#14251C;
  --warn:#E0A845; --warn-soft:#2A2214;
  --bad:#E8776C; --bad-soft:#2E1917;
  --radius:12px; --top:env(safe-area-inset-top); --bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ground)}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  padding-bottom:calc(120px + var(--bot));
}
input,textarea{-webkit-user-select:text;user-select:text}
.wrap{max-width:540px;margin:0 auto;padding:0 16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:inherit}
.hidden{display:none!important}

#gate{position:fixed;inset:0;z-index:100;background:var(--ground);display:flex;
  flex-direction:column;justify-content:center;padding:calc(24px + var(--top)) 24px calc(24px + var(--bot))}
.gtitle{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;font-size:42px;
  line-height:.95;text-transform:uppercase;letter-spacing:.02em;margin:0 0 8px}
.gtitle span{color:var(--accent)}
.gsub{color:var(--muted);font-size:15px;margin:0 0 26px;max-width:32ch}
#gate input{width:100%;height:54px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink);padding:0 14px;font-size:16px;margin-bottom:10px;font-family:inherit}
#gate input::placeholder{color:var(--faint)}
.gbtn{width:100%;height:54px;border:0;border-radius:10px;background:var(--accent);
  color:var(--accent-ink);font:600 16px/1 "IBM Plex Sans",sans-serif;cursor:pointer;margin-top:6px}
.gskip{width:100%;height:48px;border:0;background:transparent;color:var(--muted);
  font:500 14px/1 "IBM Plex Sans",sans-serif;cursor:pointer;margin-top:10px;text-decoration:underline}
.gerr{color:var(--bad);font-size:13px;min-height:20px;margin-top:12px}

header{position:sticky;top:0;z-index:30;background:var(--ground);padding-top:var(--top);
  border-bottom:1px solid var(--line-soft)}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 0 8px}
.hctx{min-width:0;flex:1}
.hctx b{display:block;font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;
  font-size:19px;letter-spacing:.05em;text-transform:uppercase;line-height:1.1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hctx span{font:500 11px/1.3 "IBM Plex Sans",sans-serif;color:var(--muted);letter-spacing:.04em}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px;flex-shrink:0}
.tab{font:600 13px/1 "IBM Plex Sans",sans-serif;min-height:44px;padding:0 12px;border:0;
  border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.chip{display:flex;align-items:center;gap:6px;font:500 12px/1 "IBM Plex Sans",sans-serif;
  color:var(--muted);padding:4px 0 11px;background:transparent;border:0;cursor:pointer;
  font-family:inherit;text-align:left;min-height:32px}
.chip .d{width:7px;height:7px;border-radius:50%;background:var(--faint);flex-shrink:0}
.chip.ok .d{background:var(--good)}
.chip.off .d{background:var(--warn)}

.weeknav{display:flex;align-items:center;gap:6px;padding:10px 0 2px}
.navbtn{width:44px;height:44px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface);color:var(--ink-2);font-size:20px;cursor:pointer;flex-shrink:0}
.navbtn:disabled{opacity:.3}
.navlbl{flex:1;min-height:44px;border:0;background:transparent;color:var(--muted);
  font:600 12px/1.3 "IBM Plex Sans",sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.navlbl:disabled{cursor:default}

.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:10px 0 14px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px;
  cursor:pointer;color:var(--muted);display:flex;flex-direction:column;gap:3px;align-items:center;
  min-height:64px;justify-content:center}
.day .dow{font:600 11px/1 "IBM Plex Sans",sans-serif;letter-spacing:.06em;text-transform:uppercase}
.day .dnum{font:600 17px/1 "IBM Plex Mono",monospace;color:var(--ink-2);font-variant-numeric:tabular-nums}
.day .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.day.has .dot{background:var(--good)}
.day.part .dot{background:var(--muted);width:4px;height:4px}
.day.out{opacity:.32}
.day.rest .dnum{color:var(--faint)}
.day[aria-current="date"]{border-color:var(--accent);background:var(--accent-soft)}
.day[aria-current="date"] .dnum{color:var(--accent)}
.day.today .dow{color:var(--ink);font-weight:700}

.sesshead{display:flex;align-items:baseline;gap:10px;padding:0 0 10px}
.sesstitle{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;font-size:34px;
  line-height:1;text-transform:uppercase;text-wrap:balance}
.sessdate{font:500 12px/1 "IBM Plex Sans",sans-serif;color:var(--muted);letter-spacing:.05em;
  text-transform:uppercase;margin-left:auto;white-space:nowrap}
.rulestrip{width:100%;text-align:left;border:1px solid var(--line-soft);background:var(--surface);
  border-radius:10px;padding:11px 12px;margin-bottom:12px;color:var(--ink-2);font-size:13px;
  line-height:1.45;cursor:pointer}
.rulestrip b{color:var(--accent);font-weight:600}
.pickrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pick{min-height:52px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  color:var(--ink);font:600 14px/1 "IBM Plex Sans",sans-serif;cursor:pointer}
.movedpill{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.movedpill button{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:8px;min-height:38px;padding:0 12px;font:600 12px/1 "IBM Plex Sans",sans-serif;cursor:pointer}

.ex{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:13px;margin-bottom:10px}
.exhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.exname{font-weight:600;font-size:16px;line-height:1.2}
.prescr{font:500 11px/1 "IBM Plex Mono",monospace;color:var(--muted);background:var(--surface-2);
  padding:5px 7px;border-radius:5px;white-space:nowrap}
.lastline{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.bumped{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--accent-soft);
  border-radius:8px;padding:8px 10px;font-size:12px;color:var(--accent);line-height:1.35}
.bumped button{margin-left:auto;border:1px solid var(--accent);background:transparent;color:var(--accent);
  border-radius:7px;min-height:36px;padding:0 11px;font:600 12px/1 "IBM Plex Sans",sans-serif;cursor:pointer;flex-shrink:0}
.wrow{display:flex;align-items:center;gap:8px;margin:10px 0 11px}
.wlab{font:600 11px/1 "IBM Plex Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wgt{display:flex;align-items:center;gap:3px;margin-left:auto}
.wbtn{width:44px;height:44px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);
  color:var(--ink-2);font:600 22px/1 "IBM Plex Sans",sans-serif;cursor:pointer;flex-shrink:0}
.wbtn:active{background:var(--line)}
.wbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;
  background:var(--surface-2);height:44px;padding:0 9px}
.winput{width:56px;border:0;background:transparent;color:var(--ink);text-align:right;
  font:600 17px/1 "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;padding:0}
.wunit{font:500 12px/1 "IBM Plex Mono",monospace;color:var(--muted);padding-left:3px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.setrow{display:flex;align-items:flex-start;gap:7px}
.setlab{font:600 11px/1 "IBM Plex Sans",sans-serif;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);padding-top:21px;flex-shrink:0;width:32px}
.sets{display:flex;gap:7px;flex:1;min-width:0}
.slot{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.slotbtn{width:100%;height:58px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);
  color:var(--ink);font:600 23px/1 "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.slotbtn.empty{color:var(--faint);font-weight:500}
.slot.grind .slotbtn{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.slotfoot{text-align:center;font:600 10px/1 "IBM Plex Sans",sans-serif;letter-spacing:.08em;
  color:var(--faint);text-transform:uppercase;min-height:12px}
.slotfoot.f{color:var(--accent)}
.exfoot{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
.drop{font:500 12px/1 "IBM Plex Mono",monospace;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font:600 11px/1 "IBM Plex Sans",sans-serif;letter-spacing:.04em;padding:6px 9px;border-radius:99px}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.up{background:var(--accent-soft);color:var(--accent)}
.cue{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:9px;padding-left:10px;
  border-left:2px solid var(--line)}

.meta{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.metarow{display:flex;gap:9px}
.field{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.field label{font:600 11px/1 "IBM Plex Sans",sans-serif;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap}
.field input{width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface-2);color:var(--ink);padding:0 10px;font:500 16px/1 "IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace}
textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink);
  padding:11px;font:400 16px/1.45 "IBM Plex Sans",sans-serif;resize:vertical;min-height:74px;margin-top:9px;font-family:inherit}
textarea::placeholder{color:var(--faint)}
.hint{font-size:12px;color:var(--faint);line-height:1.55;padding:4px 2px 18px}

.pad{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);
  border-top:1px solid var(--line);transform:translateY(110%);transition:transform .2s ease;
  box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.pad.on{transform:none}
.padin{max-width:540px;margin:0 auto;padding:12px 16px calc(14px + var(--bot))}
.padhead{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.padhead b{font-size:15px;font-weight:600}
.padhead span{font:500 12px/1 "IBM Plex Mono",monospace;color:var(--muted);margin-left:auto}
.padgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.padbtn{height:52px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);
  color:var(--ink);font:600 18px/1 "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;cursor:pointer}
.padbtn.inrange{border-color:var(--accent);color:var(--accent)}
.padbtn:active{background:var(--line)}
.padrow2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.padalt{min-height:48px;border:1px solid var(--line);border-radius:9px;background:transparent;
  color:var(--muted);font:600 13px/1 "IBM Plex Sans",sans-serif;cursor:pointer}
.padalt.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.rest{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--line);transform:translateY(115%);transition:transform .22s ease}
.rest.on{transform:none}
.rest.done{background:var(--good-soft);border-top-color:var(--good)}
.restin{max-width:540px;margin:0 auto;padding:12px 16px calc(12px + var(--bot));display:flex;align-items:center;gap:12px}
.clock{font:600 36px/1 "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;min-width:92px}
.rest.done .clock{color:var(--good)}
.restlbl{font-size:12px;color:var(--muted);flex:1;line-height:1.35;min-width:0}
.restlbl b{display:block;color:var(--ink-2);font-size:13px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.bar{position:absolute;left:0;top:0;height:3px;background:var(--accent);width:0}
.rest.done .bar{background:var(--good)}
.xbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:9px;
  height:48px;padding:0 18px;cursor:pointer;font:600 13px/1 "IBM Plex Sans",sans-serif;flex-shrink:0}

.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:15px;margin-bottom:10px}
.statlab{font:600 11px/1 "IBM Plex Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bignum{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;font-size:50px;line-height:.95;
  font-variant-numeric:tabular-nums;margin:8px 0 4px}
.bignum small{font-size:23px;color:var(--muted)}
.statnote{font-size:13px;color:var(--muted);line-height:1.5}
.sessline{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft)}
.sessline:first-child{border-top:0}
.sesslab{font:600 12px/1 "IBM Plex Sans",sans-serif;width:66px;flex-shrink:0;color:var(--ink-2)}
.reps{font:600 14px/1 "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;letter-spacing:.06em;flex-shrink:0}
.reps em{font-style:normal;color:var(--accent)}
.exlab{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2.sec{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;font-size:16px;color:var(--muted);margin:22px 0 9px}
.empty{color:var(--muted);font-size:13px;padding:2px 0 12px;line-height:1.55}
.copybtn{width:100%;min-height:52px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);
  color:var(--ink);font:600 15px/1 "IBM Plex Sans",sans-serif;cursor:pointer;margin-top:4px}
.ptext{font-size:14px;line-height:1.6;color:var(--ink-2)}
.ptext p{margin:0 0 11px}
.ptext p:last-child{margin-bottom:0}
.ptext b{color:var(--ink);font-weight:600}
.ptext ol{margin:0;padding-left:20px}
.ptext li{margin-bottom:8px}
.ptable{width:100%;border-collapse:collapse;font-size:13px}
.ptable th{text-align:left;font:600 11px/1 "IBM Plex Sans",sans-serif;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);padding:0 0 8px}
.ptable th:nth-child(2),.ptable th:nth-child(3){text-align:right}
.ptable td{padding:9px 0;border-top:1px solid var(--line-soft);color:var(--ink-2)}
.ptable td:nth-child(2),.ptable td:nth-child(3){font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;color:var(--ink)}
.ptable tr.big td:first-child{color:var(--accent)}

/* ---------- guided session ---------- */
.runcol{padding-top:16px}
.quietbtn.danger{color:var(--bad);text-decoration:none;border:1px solid var(--bad);
  border-radius:9px;padding:0 16px;min-height:46px}
.sessline.hist{width:100%;background:transparent;border-left:0;border-right:0;border-top:1px solid var(--line-soft);
  border-bottom:0;text-align:left;cursor:pointer;min-height:52px}
.sessline.hist:first-child{border-top:0}
.endrow{display:flex;justify-content:center;padding:6px 0 20px}
.runhead{position:sticky;top:0;z-index:20;background:var(--ground);padding:10px 0 12px;margin-bottom:4px}
.runname{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;font-size:26px;
  line-height:1;text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
.segs{display:flex;gap:3px;margin-bottom:7px}
.seg{flex:1;height:5px;border-radius:3px;background:var(--line)}
.seg.on{background:var(--accent)}
.runsub{font:500 12px/1 "IBM Plex Sans",sans-serif;color:var(--muted);letter-spacing:.03em}

.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:16px;margin-bottom:10px}
.card.open{border-color:var(--line);box-shadow:0 6px 26px -14px rgba(0,0,0,.7)}
.card.drop{background:var(--warn-soft);border-color:var(--warn)}
.card.warm{border-color:var(--line)}
.kicker{font:600 11px/1 "IBM Plex Sans",sans-serif;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);margin-bottom:9px}
.bigtitle{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;font-size:36px;
  line-height:1;text-transform:uppercase;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.meta2{font-size:13px;color:var(--ink-2);margin-top:10px}
.exnames{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.warnline{font-size:13px;color:var(--accent);line-height:1.5;margin-top:12px}
.card.warm .warnline,.card.drop .warnline{color:var(--warn)}
.rule{font-size:13px;color:var(--muted);line-height:1.5;margin-top:12px}

.runbtn{width:100%;min-height:62px;border:0;border-radius:11px;background:var(--surface-2);
  color:var(--ink);font:600 17px/1.25 "IBM Plex Sans",sans-serif;cursor:pointer;margin-top:14px;padding:0 14px}
.runbtn.go{background:var(--accent);color:var(--accent-ink)}
.runbtn.amber{background:var(--warn);color:#20180a}
.runbtn.sm{width:auto;min-height:44px;padding:0 18px;margin:0;font-size:14px;flex-shrink:0}
.runbtn:active{opacity:.86}
.quietbtn{border:0;background:transparent;color:var(--muted);font:500 13px/1 "IBM Plex Sans",sans-serif;
  min-height:44px;padding:0 4px;cursor:pointer;text-decoration:underline}
.cardfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}

.warmrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line-soft)}
.warmrow:first-of-type{border-top:0}
.warmtxt{flex:1;min-width:0}
.warmmain{font-size:14px;color:var(--ink)}
.warmrow.on .warmmain{color:var(--muted)}
.warmwhy{font-size:12px;color:var(--faint);margin-top:3px;line-height:1.4}
.warmthen{font-size:13px;color:var(--ink-2);margin-top:12px}

.cardhead{display:flex;align-items:center;gap:10px}
.cardname{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;font-size:24px;
  line-height:1.05;text-transform:uppercase;letter-spacing:.02em;flex:1;min-width:0}
.cardtag{font:600 10px/1 "IBM Plex Sans",sans-serif;letter-spacing:.1em;color:var(--accent);flex-shrink:0}
.wrow2{display:flex;align-items:center;gap:10px;margin-top:14px}
.wbig{font:600 22px/1 "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  min-width:96px;text-align:center}
.setof{margin-left:auto;font:500 12px/1 "IBM Plex Sans",sans-serif;color:var(--muted);white-space:nowrap}
.slots2{display:flex;gap:7px;margin-top:13px}
.s2{flex:1;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  font:600 17px/1 "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.s2.e{color:var(--faint);font-weight:500}
.s2.g{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.hero{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;font-size:52px;line-height:1;
  text-transform:uppercase;letter-spacing:.02em;color:var(--accent);text-align:center;margin-top:20px}
.hero.fail{font-size:38px;color:var(--ink)}
.herosub{font-size:13px;color:var(--muted);line-height:1.5;text-align:center;margin-top:8px}
.lastline{font-size:12px;color:var(--muted);margin-top:12px;font-variant-numeric:tabular-nums}

.restpanel{margin-top:16px;border-top:1px solid var(--line-soft);padding-top:14px}
.restlogged{font-size:12.5px;color:var(--muted)}
.restbig{font:600 62px/1 "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  text-align:center;margin:10px 0 6px}
.restwhy{font-size:12.5px;color:var(--muted);text-align:center}
.coach{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin-top:12px;
  padding-left:11px;border-left:2px solid var(--accent)}

.dropnums{font:600 40px/1 "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  letter-spacing:.04em;margin-bottom:6px}
.dropline{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-top:12px}
.upline{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;padding:7px 0;
  border-top:1px solid var(--line-soft)}
.onething{font-size:14.5px;color:var(--ink);line-height:1.5}
.nextline{font-size:13px;color:var(--muted);line-height:1.5;margin-top:14px;
  padding-top:12px;border-top:1px solid var(--line-soft)}

.qlab{font:600 11px/1 "IBM Plex Sans",sans-serif;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:18px 0 9px}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.runbtn.chip2{width:auto;min-height:46px;padding:0 16px;margin:0;font-size:15px;
  background:var(--surface-2);color:var(--ink)}
.runbtn.chip2.on{background:var(--accent-soft);color:var(--accent)}

.line{width:100%;display:flex;align-items:center;gap:9px;text-align:left;
  background:transparent;border:0;border-bottom:1px solid var(--line-soft);
  padding:13px 2px;color:var(--muted);cursor:pointer;min-height:48px}
.lmark{width:14px;flex-shrink:0;color:var(--good);font-size:14px}
.line.bad .lmark{color:var(--warn)}
.lname{font-size:14px;color:var(--ink-2);flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.lw{font:500 12px/1 "IBM Plex Mono",monospace;color:var(--muted);white-space:nowrap}
.lreps{font:600 13px/1 "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  color:var(--ink);white-space:nowrap}
.ltag{font:600 10px/1 "IBM Plex Sans",sans-serif;letter-spacing:.05em;color:var(--faint);
  white-space:nowrap;text-transform:uppercase}
.ltag.bad{color:var(--warn)}
.line.pend{opacity:.62}

.padstack{display:flex;flex-direction:column;gap:7px}
.bigopt{width:100%;min-height:66px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface-2);color:var(--ink);font:600 16px/1.3 "IBM Plex Sans",sans-serif;
  cursor:pointer;padding:0 14px}
.bigopt.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bigopt.amber{background:transparent;border-color:var(--warn);color:var(--warn)}
.bigopt.ghost{min-height:52px;color:var(--muted);font-size:14px}
.bigopt.opt{min-height:68px}
.padbtn.target{border-color:var(--accent);color:var(--accent);font-weight:600;
  box-shadow:inset 0 0 0 1px var(--accent)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="gate" class="hidden">
  <h1 class="gtitle">Two In<br><span>Reserve</span></h1>
  <p class="gsub">Your email, once. That is the whole sign-in — after this it opens straight into your log, on this device, forever.</p>
  <input id="gmail" type="email" inputmode="email" autocomplete="username" enterkeyhint="go"
         placeholder="Email" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="gbtn" id="gsubmit">Continue</button>
  <button class="gskip" id="gskip">Log without signing in</button>
  <div class="gerr" id="gerr"></div>
</div>

<header>
  <div class="wrap">
    <div class="hrow">
      <div class="hctx"><b id="hctxt">Workout</b><span id="hctxs"></span></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-day" aria-selected="true">Day</button>
        <button class="tab" role="tab" id="tab-week" aria-selected="false">Week</button>
        <button class="tab" role="tab" id="tab-plan" aria-selected="false">Plan</button>
      </div>
    </div>
    <button class="chip" id="sync" title="Tap to check for updates"><span class="d"></span><span id="syncmsg">Starting</span></button>
  </div>
</header>

<main class="wrap">
  <div class="weeknav" id="weeknav">
    <button class="navbtn" id="wprev" aria-label="Previous week">&lsaquo;</button>
    <button class="navlbl" id="wtoday"></button>
    <button class="navbtn" id="wnext" aria-label="Next week">&rsaquo;</button>
  </div>

  <section id="view-day">
    <div class="daystrip" id="daystrip"></div>
    <div class="sesshead">
      <div class="sesstitle" id="sesstitle">&mdash;</div>
      <div class="sessdate" id="sessdate"></div>
    </div>
    <div id="sesspick"></div>
    <div id="exlist"></div>
    <div class="meta">
      <div class="metarow">
        <div class="field"><label for="bw">Weight</label><input id="bw" type="number" inputmode="decimal" step="0.1" placeholder="kg"></div>
        <div class="field"><label for="prot">Protein</label><input id="prot" type="number" inputmode="numeric" placeholder="g"></div>
      </div>
      <textarea id="note" placeholder="Anything worth saying — sleep, a machine taken, pain, rushed session."></textarea>
    </div>
    <div class="hint" id="dayhint"></div>
  </section>

  <section id="view-week" class="hidden"><div id="weekbody"></div></section>
  <section id="view-plan" class="hidden"><div id="planbody"></div></section>
</main>

<div class="pad" id="pad">
  <div class="padin">
    <div class="padhead"><b id="padwhat">&mdash;</b><span id="padrange"></span></div>
    <div class="padgrid" id="padgrid"></div>
    <div class="padrow2">
      <button class="padalt" id="padgrind">Mark as a grind</button>
      <button class="padalt" id="padclear">Clear &middot; close</button>
    </div>
  </div>
</div>

<div class="rest" id="rest">
  <div class="bar" id="restbar"></div>
  <div class="restin">
    <div class="clock" id="clock">3:00</div>
    <div class="restlbl"><b id="restwhat">&mdash;</b><span id="restsub"></span></div>
    <button class="xbtn" id="restskip">Skip</button>
  </div>
</div>

<script src="./config.js"></script>
<script src="./vendor/supabase.js"></script>
<script src="./app.js"></script>
</body>
</html>
